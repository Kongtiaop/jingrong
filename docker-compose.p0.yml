name: wealth-p0
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wealth_manager}
      POSTGRES_USER: ${POSTGRES_USER:-wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealth_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wealth_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealth} -d ${POSTGRES_DB:-wealth_manager}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - wealth-p0

  redis:
    image: redis:7.4-alpine
    container_name: wealth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - wealth_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - wealth-p0

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    networks:
      - wealth-p0
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - wealth-p0
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.outbox_worker"]
    networks:
      - wealth-p0

  authorization-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.authorization_worker"]
    networks:
      - wealth-p0

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.notification_worker"]
    networks:
      - wealth-p0

  knowledge-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: ["python", "-m", "workers.knowledge_worker"]
    networks:
      - wealth-p0

  data-catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.data_catalog_worker"]
    networks:
      - wealth-p0
  customer-service-timeout-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    profiles: ["customer_service"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      CUSTOMER_SERVICE_TIMEOUT_WORKER_ENABLED: "true"
      CUSTOMER_SERVICE_TIMEOUT_WORKER_POLL_SECONDS: ${CUSTOMER_SERVICE_TIMEOUT_WORKER_POLL_SECONDS:-30}
      CUSTOMER_SERVICE_HEARTBEAT_TIMEOUT_SECONDS: ${CUSTOMER_SERVICE_HEARTBEAT_TIMEOUT_SECONDS:-90}
      CUSTOMER_SERVICE_WAITING_TIMEOUT_SECONDS: ${CUSTOMER_SERVICE_WAITING_TIMEOUT_SECONDS:-1800}
      CUSTOMER_SERVICE_WAITING_CLEANUP_ENABLED: ${CUSTOMER_SERVICE_WAITING_CLEANUP_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "workers.customer_service_timeout_worker"]
    networks:
      - wealth-p0
  aml-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.aml-scheduler
    restart: unless-stopped
    profiles: ["aml"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      AML_SCHEDULER_ENABLED: "true"
      AML_SCHEDULER_POLL_SECONDS: ${AML_SCHEDULER_POLL_SECONDS:-60}
      AML_SCHEDULER_HOUR_UTC: ${AML_SCHEDULER_HOUR_UTC:-1}
      AML_SCHEDULER_MINUTE_UTC: ${AML_SCHEDULER_MINUTE_UTC:-10}
      AML_SCHEDULER_DAYS: ${AML_SCHEDULER_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "workers.aml_scheduler"]
    networks:
      - wealth-p0

  bad-case-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: ["python", "-m", "workers.bad_case_worker"]
    networks:
      - wealth-p0
  memory-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.memory_worker"]
    networks:
      - wealth-p0

volumes:
  wealth_pgdata:
    name: wealth_pgdata
  wealth_redisdata:
    name: wealth_redisdata

networks:
  wealth-p0:
    name: wealth-p0




name: wealth-manager
services:
  postgres:
    # ParadeDB pg16 镜像：含 pgvector(0.8.4) + pg_search(0.25.6)，PGDATA 仍为 /var/lib/postgresql/data，
    # 与既有数据卷(PG16)兼容，可直接在同一卷上启用 BM25。若需回退 tsvector 可换回 pgvector/pgvector:pg16。
    image: docker.m.daocloud.io/paradedb/paradedb:pg16
    container_name: wealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wealth_manager}
      POSTGRES_USER: ${POSTGRES_USER:-wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealth_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wealth_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wealth} -d $${POSTGRES_DB:-wealth_manager}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: wealth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - wealth_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.6.16
    container_name: wealth-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - wealth_milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysql-migration:
    image: mysql:8.0
    container_name: wealth-mysql-migration
    restart: "no"
    profiles: ["migration"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wealth_root_migration}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wealth_manager}
      MYSQL_USER: ${MYSQL_USER:-wealth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wealth_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - wealth_mysqldata:/var/lib/mysql
    networks:
      - wealth-migration
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER:-wealth} -p$${MYSQL_PASSWORD:-wealth_dev} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # BM25 默认开启（postgres 用 ParadeDB pg16 镜像）。扩展缺失时检索层自动降级回 tsvector。
      FULLTEXT_BACKEND: ${FULLTEXT_BACKEND:-pg_search}
      # LangGraph Supervisor 真图接线（渐进式，默认全关 → 生产走确定性管线）。
      # 注意：容器 environment 是白名单，.env 里写了但这里没列的变量不会传进容器。
      AGENT_GRAPH_ENABLED: ${AGENT_GRAPH_ENABLED:-false}
      AGENT_GRAPH_SHADOW_ENABLED: ${AGENT_GRAPH_SHADOW_ENABLED:-false}
      AGENT_CHECKPOINT_ENABLED: ${AGENT_CHECKPOINT_ENABLED:-false}
      AGENT_GRAPH_MAX_ITERATIONS: ${AGENT_GRAPH_MAX_ITERATIONS:-20}
      AGENT_GRAPH_MAX_TOOL_CALLS: ${AGENT_GRAPH_MAX_TOOL_CALLS:-20}
      # 只读查询的模型自主工具调度（function calling）：模型决定调哪个只读工具、是否续调。
      # 资金/风控仍走确定性路径（写操作不在工具集中）。默认关 → 回退确定性 ReAct。
      AGENT_MODEL_TOOL_SELECTION_ENABLED: ${AGENT_MODEL_TOOL_SELECTION_ENABLED:-false}
      AGENT_MODEL_TOOL_MAX_ROUNDS: ${AGENT_MODEL_TOOL_MAX_ROUNDS:-4}
      # 受控只读子代理并行：模型按任务复杂度判断"要不要拆、能不能并行"。
      # 只影响只读查询；资金/订单/风控结论/写操作永不进此层。默认关 → 行为不变。
      AGENT_SUBAGENT_FANOUT_ENABLED: ${AGENT_SUBAGENT_FANOUT_ENABLED:-false}
      # LLM 资源保护：SDK 重试次数 / 在途并发上限 / 工具轮超时
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-1}
      QWEN_MAX_CONCURRENCY: ${QWEN_MAX_CONCURRENCY:-8}
      QWEN_TOOL_CALL_TIMEOUT_SECONDS: ${QWEN_TOOL_CALL_TIMEOUT_SECONDS:-15}
      # 网关级保护（请求护栏中间件）：体限 / 全局超时 / 限流 / GZip / CORS 白名单。
      REQUEST_MAX_BODY_BYTES: ${REQUEST_MAX_BODY_BYTES:-12582912}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-0}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      GZIP_MIN_SIZE_BYTES: ${GZIP_MIN_SIZE_BYTES:-1024}
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.outbox_worker"]

  knowledge-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: ["python", "-m", "workers.knowledge_worker"]

  data-catalog-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.data_catalog_worker"]
  aml-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.aml-scheduler
    restart: unless-stopped
    profiles: ["aml"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wealth}:${POSTGRES_PASSWORD:-wealth_dev}@postgres:5432/${POSTGRES_DB:-wealth_manager}
      AML_SCHEDULER_ENABLED: "true"
      AML_SCHEDULER_POLL_SECONDS: ${AML_SCHEDULER_POLL_SECONDS:-60}
      AML_SCHEDULER_HOUR_UTC: ${AML_SCHEDULER_HOUR_UTC:-1}
      AML_SCHEDULER_MINUTE_UTC: ${AML_SCHEDULER_MINUTE_UTC:-10}
      AML_SCHEDULER_DAYS: ${AML_SCHEDULER_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "workers.aml_scheduler"]

volumes:
  wealth_pgdata:
  wealth_redisdata:
  wealth_milvusdata:
  wealth_mysqldata:

networks:
  wealth-migration:
    name: wealth-migration

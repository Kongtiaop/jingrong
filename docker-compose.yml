name: wealth-manager
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wealth_manager}
      POSTGRES_USER: ${POSTGRES_USER:-wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealth_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wealth_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wealth} -d $${POSTGRES_DB:-wealth_manager}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: wealth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - wealth_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.6.16
    container_name: wealth-milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - wealth_milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: wealth-mysql-migration
    restart: unless-stopped
    profiles: ["migration"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wealth_root_migration}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wealth_manager}
      MYSQL_USER: ${MYSQL_USER:-wealth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wealth_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - wealth_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER:-wealth}", "-p$${MYSQL_PASSWORD:-wealth_dev}"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  wealth_pgdata:
  wealth_redisdata:
  wealth_milvusdata:
  wealth_mysqldata:

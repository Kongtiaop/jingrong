# 前端 nginx：托管 Vue SPA，/api 反代到后端 api 服务
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存：文件名含构建哈希，内容变化即换名，故可长缓存。
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html **必须不可缓存**——它是"指向当前构建产物"的那张表。
    #
    # 为什么单列一条 location：原先它走下面的 `location /`，没有任何 Cache-Control，
    # 浏览器遂按启发式规则自行决定缓存时长（依据 Last-Modified）。后果是：
    # 重新构建后文件名变了（index-<hash>.js），但浏览器仍用旧 index.html，
    # 于是加载旧 bundle，页面表现是"改了但没生效"——实测排查转人工卡片时
    # 就卡在这里（后端与 WS 载荷均已验证正确，页面却仍是旧行为）。
    # 带哈希的资源可以长缓存，唯独这张入口表不行。
    location = /index.html {
        # 只发这一条：`expires -1` 会再补一个 Cache-Control: no-cache，
        # 两条同名头同时出现会让部分代理/浏览器取其一，反而不确定。
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 回退：非文件路由都返回 index.html，交给 Vue Router
    location / {
        try_files $uri $uri/ /index.html;
        # 兜底：try_files 内部重定向到 /index.html 时 headers 按上面那条规则下发；
        # 其余静态文件（favicon 等）不缓存，避免同类问题。
        add_header Cache-Control "no-cache";
    }

    # API 反向代理（保留 /api/v1 完整路径，含 SSE/WebSocket 升级头）
    # 用变量 + Docker 内嵌 DNS 做运行时解析：避免 api 容器重建换 IP 后，nginx
    # 仍缓存旧的静态解析结果导致 502 Connection refused。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/流式响应必须关缓冲，否则 nginx 会把逐 token 攒到上游结束才一次发给浏览器，
        # 前端就看不到逐字流式（表现是“卡一会→一下整段蹦出”）。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 120s;
    }
}

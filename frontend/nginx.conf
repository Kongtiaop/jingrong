# 前端 nginx：托管 Vue SPA，/api 反代到后端 api 服务
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 回退：非文件路由都返回 index.html，交给 Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（保留 /api/v1 完整路径，含 SSE/WebSocket 升级头）
    # 用变量 + Docker 内嵌 DNS 做运行时解析：避免 api 容器重建换 IP 后，nginx
    # 仍缓存旧的静态解析结果导致 502 Connection refused。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
